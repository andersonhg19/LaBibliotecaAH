name: ci

on:
  push:
    # main y las ramas de trabajo (ola/*): el CI tiene que estar en verde ANTES de integrar y de desplegar.
    branches: [main, 'ola/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22.23.5'  # Node 22 LTS fijado (OP-09); la misma version que frontend/Dockerfile y .nvmrc
  PYTHON_VERSION: '3.12'
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: America/Bogota

jobs:
  secretos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ningun .env trackeado
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.ejemplo$'; then
            echo "FALLA: hay archivos .env en git"; exit 1
          fi
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Compilar, probar y medir cobertura (puerta unica)
        run: mvn -B clean verify

  taller:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: taller
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg pandoc
      # OP-01: pyproject no define el extra [dev]; las herramientas (ruff, mypy, pytest) estan en requirements-dev.txt.
      - name: Dependencias
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      # Como la imagen `pruebas` del taller: mypy segun [tool.mypy] de pyproject (paquete app), no las pruebas.
      - run: mypy
      - run: pytest

  traductor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: traductor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencias (fijadas con hashes)
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Sin el modelo real (pesa ~160 MB y se convierte al construir la imagen): la prueba de humo con el
      # modelo corre en la imagen `pruebas` (docker build --target pruebas).
      - run: pytest -m "not modelo"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Aviso (no rompe): vulnerabilidades criticas en dependencias de ejecucion (OP-10).
      - name: npm audit (ejecucion, criticas)
        run: npm audit --omit=dev --audit-level=critical || echo "::warning::npm audit encontro vulnerabilidades criticas en dependencias de ejecucion"
      - run: npm run lint
      - run: npm run formato:revisar
      - run: npm run tipos
      - run: npx jest --coverage --ci
