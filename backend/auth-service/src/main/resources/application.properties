server.port=8921
server.servlet.context-path=/biblioteca
spring.application.name=auth-service

spring.config.import=optional:file:.env[.properties]

eureka.instance.preferIpAddress=true
# Despliegues sin errores: latido cada 5 s y baja a los 15 s si deja de latir.
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
spring.cloud.discovery.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# El esquema lo pone Flyway; Hibernate solo comprueba que coincida con el mapeo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jackson.time-zone=America/Bogota

spring.flyway.enabled=true

# Mensajes al usuario (estandares §16): messages_es.properties, siempre en espanol.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://discovery-service:8860/eureka}

# SECRET es OBLIGATORIO y no tiene valor por defecto: SecParams detiene el
# arranque con un mensaje claro si falta (un secreto por defecto escrito en el
# repo firma tokens que cualquiera puede falsificar).
secret=${SECRET:}
# Vida del token en ms (QA SE-02): 24 h por defecto. La web lo renueva con
# /v1/auth/renovar; ademas cada cuenta tiene version de sesion (claim "ver").
expired-time=${EXP_TIME:86400000}

# QA SE-03: alta publica cerrada por defecto; las cuentas las crea un ADMIN.
biblioteca.registro-publico=${REGISTRO_PUBLICO:false}
# QA SE-08: proxies de confianza delante de auth (Tailscale serve + gateway).
# El origen de un login es la entrada de X-Forwarded-For que anadio el mas
# externo de ellos. 1 si no hay Tailscale serve delante del gateway.
biblioteca.login.proxies-confiables=${LOGIN_PROXIES_CONFIABLES:2}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Auditoria: cuanto se guarda y cuando se limpia.
audit.retention-days=${AUDIT_RETENTION_DAYS:365}
audit.cleanup-cron=${AUDIT_CLEANUP_CRON:0 30 3 * * *}

logging.pattern.level=%5p [%X{requestId:-}]
