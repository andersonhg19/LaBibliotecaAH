server.port=8921
server.servlet.context-path=/biblioteca
spring.application.name=auth-service

spring.config.import=optional:file:.env[.properties]

eureka.instance.preferIpAddress=true
spring.cloud.discovery.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# El esquema lo pone Flyway; Hibernate solo comprueba que coincida con el mapeo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jackson.time-zone=America/Bogota

spring.flyway.enabled=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://discovery-service:8860/eureka}

# SECRET es OBLIGATORIO y no tiene valor por defecto: SecParams detiene el
# arranque con un mensaje claro si falta (un secreto por defecto escrito en el
# repo firma tokens que cualquiera puede falsificar).
secret=${SECRET:}
expired-time=${EXP_TIME:864000000}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Auditoria: cuanto se guarda y cuando se limpia.
audit.retention-days=${AUDIT_RETENTION_DAYS:365}
audit.cleanup-cron=${AUDIT_CLEANUP_CRON:0 30 3 * * *}

logging.pattern.level=%5p [%X{requestId:-}]
