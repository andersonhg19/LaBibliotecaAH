# Mensajes al usuario de auth-service (UTF-8). Claves = Message.Msj.
# MessageFormat: las comillas simples se escriben dobles.
# Los endpoints heredados de administracion siguen devolviendo la CLAVE (la web
# la traduce); los mensajes nuevos salen de aqui ya en espanol.
aliasObligatorio=Elige un nombre de usuario.
aliasInvalido=El usuario debe tener de 3 a 30 caracteres: letras sin tilde, números, punto (.), guion (-) o guion bajo (_). Sin espacios ni @.
aliasNoDisponible=Ese nombre de usuario ya está en uso. Prueba con otro.
usuarioObligatorio=Escribe tu correo o tu usuario.
credencialesIncorrectas=Correo/usuario o contraseña incorrectos
claveDeOtraCuenta=La contraseña de otra cuenta no se cambia desde Administración: cada quien cambia la suya.
registroCerrado=El registro está cerrado: pide a un administrador que te cree la cuenta.
sesionNoVigente=Tu sesión ya no es válida. Vuelve a iniciar sesión.
claveDebil=Esa contraseña es demasiado fácil de adivinar: usa al menos 10 caracteres variados, sin espacios al principio ni al final.
rutaInvalida=La dirección pedida no es válida.
rutaNoEncontrada=La dirección pedida no existe.
errorInesperado=Ocurrió un error inesperado procesando la petición. Inténtalo de nuevo.
