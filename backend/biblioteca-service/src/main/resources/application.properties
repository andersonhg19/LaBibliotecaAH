server.port=8925
server.servlet.context-path=/biblioteca
spring.application.name=biblioteca-service

spring.config.import=optional:file:.env[.properties]

eureka.instance.preferIpAddress=true
# Despliegues sin errores: latido cada 5 s y baja a los 15 s si deja de latir.
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
spring.cloud.discovery.enabled=true
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://discovery-service:8860/eureka}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/biblioteca_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# El esquema lo pone Flyway; Hibernate solo comprueba que coincida con el mapeo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jackson.time-zone=America/Bogota
spring.flyway.enabled=true

# Mensajes al usuario (estandares §16): messages_es.properties, siempre en espanol.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=es
spring.web.locale-resolver=fixed

# Timeouts hacia el taller (estandares §22).
biblioteca.timeout-conexion-ms=5000
biblioteca.timeout-lectura-ms=30000

# SECRET es OBLIGATORIO (sin valor por defecto): SecParams detiene el arranque si falta.
secret=${SECRET:}

# QA SE-02: cada token se confirma con auth-service (POST /v1/auth/sesion) y la
# respuesta se guarda en cache estos segundos por (usuario, version de sesion).
biblioteca.auth-url=${AUTH_URL:http://auth-service:8921}
biblioteca.sesion.verificar=true
biblioteca.sesion.cache-segundos=${SESION_CACHE_SEGUNDOS:30}
biblioteca.sesion.timeout-ms=2000

# QA SE-17: sin el usuario en memoria de Spring Boot (y su clave en el log).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# QA BI-18: 1999.5 en un campo entero es un error, no 1999.
spring.jackson.deserialization.accept-float-as-int=false

# Subidas (QA SE-07): tope por archivo y por peticion (Tomcat corta antes de
# leer mas), archivos por peticion y espacio libre que debe quedar en /datos.
# Por encima de 1 MB la parte se escribe a disco temporal (no se guarda en
# memoria) y desde ahi se copia en streaming.
spring.servlet.multipart.max-file-size=${BIBLIOTECA_MAX_ARCHIVO:300MB}
spring.servlet.multipart.max-request-size=${BIBLIOTECA_MAX_SUBIDA:1GB}
biblioteca.limites.archivos-por-subida=${BIBLIOTECA_MAX_ARCHIVOS_POR_SUBIDA:20}
biblioteca.limites.espacio-libre-minimo-mb=${BIBLIOTECA_ESPACIO_MINIMO_MB:1024}
biblioteca.limites.estantes-por-usuario=${BIBLIOTECA_MAX_ESTANTES:100}
# (v1.6) Carpetas del archivador de documentos por usuario.
biblioteca.limites.carpetas-por-usuario=${BIBLIOTECA_MAX_CARPETAS:500}
spring.servlet.multipart.file-size-threshold=1MB
# QA RG-02: si un archivo pasa del tope, Tomcat descarta (lee y tira, sin disco ni memoria) el resto
# del cuerpo hasta el tope por peticion y responde el 413 sin cortar la conexion (TomcatConfig).
server.tomcat.max-swallow-size=${BIBLIOTECA_MAX_SUBIDA:1GB}
server.tomcat.connection-timeout=10m

# Raiz de archivos (/datos en Docker, ./datos-dev en desarrollo).
biblioteca.datos=${BIBLIOTECA_DATOS:./datos-dev}
# Taller (Python): catalogo de voces.
biblioteca.taller-url=${TALLER_URL:http://taller:8926}
biblioteca.voz-por-defecto=edge.es-ES-AlvaroNeural
# Prefijo de las URLs de audio que se devuelven a la web (relativas al gateway).
biblioteca.prefijo-publico=/BIBLIOTECA-SERVICE/biblioteca
# Buzon: carpetas /datos/buzon/{email}/ -> usuario. "correo:userId,correo:userId".
# Una carpeta cuyo nombre es un numero se toma directamente como userId.
biblioteca.buzon-usuarios=${BUZON_USUARIOS:}

# Tareas programadas (en las pruebas se apagan y se llaman a mano).
biblioteca.tareas.habilitadas=true
biblioteca.tareas.metadatos-ms=10000
biblioteca.tareas.buzon-ms=60000
# Limpieza de restos (QA DA-13, DA-14, DA-28): filas de audio y carpetas de
# archivos que ya no existen en la base, con mas de 6 h sin tocar.
biblioteca.tareas.limpieza-ms=3600000
biblioteca.limpieza.edad-minima-horas=6
biblioteca.buzon-espera-ms=30000

# Traductor autoalojado (servicio propio traductor/ con Opus-MT, API compatible con LibreTranslate; contratos v1.3.1).
# Los libros no salen de casa. Timeouts: 5 s conexion / 60 s lectura (un lote de frases).
biblioteca.traductor.url=${TRADUCTOR_URL:http://traductor:5000}
biblioteca.traductor.timeout-conexion-ms=5000
biblioteca.traductor.timeout-lectura-ms=60000
# Idiomas cargados en el traductor (LT_LOAD_ONLY); "auto" se admite ademas como origen.
biblioteca.traductor.idiomas=${TRADUCTOR_IDIOMAS:en,es}
# Freno por usuario: caracteres por minuto en /v1/traducir y capitulos nuevos por hora.
biblioteca.traductor.caracteres-por-minuto=${TRADUCTOR_CARACTERES_POR_MINUTO:20000}
biblioteca.traductor.capitulos-por-hora=${TRADUCTOR_CAPITULOS_POR_HORA:30}
# Capitulos: hasta este numero de caracteres se traducen en la misma peticion (LISTO al momento);
# por encima, en segundo plano (PENDIENTE). Lotes de frases por llamada al traductor.
biblioteca.traductor.capitulo-sincrono-max-caracteres=1500
biblioteca.traductor.lote-frases=40
biblioteca.traductor.lote-caracteres=4000
biblioteca.traductor.hilos=1
biblioteca.traductor.cola=20
# Cuanto se recuerda un capitulo que fallo antes de volver a intentarlo solo.
biblioteca.traductor.error-segundos=60
# Textos sueltos guardados en bah_lib_traduccion: se purgan tras estos dias sin usarse.
biblioteca.traductor.cache-dias=180
biblioteca.tareas.traducciones-ms=86400000

logging.pattern.level=%5p [%X{requestId:-}]

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
