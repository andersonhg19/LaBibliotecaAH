# Mensajes al usuario de biblioteca-service (UTF-8). Claves = Message.Msj.
# MessageFormat: las comillas simples se escriben dobles.
sesionSinUsuario=Tu sesión no identifica a ningún usuario. Vuelve a iniciar sesión.
sesionInvalida=Sesión inválida o vencida. Vuelve a iniciar sesión.
noAutenticado=Necesitas iniciar sesión.
sinPermiso=No tienes permiso para hacer esto.
libroNoEncontrado=El libro no existe o no está en tu biblioteca.
estanteNoEncontrado=El estante no existe o no es tuyo.
anotacionNoEncontrada=La anotación no existe o no es tuya.
comentarioNoEncontrado=El comentario no existe o no es tuyo.
archivoNoEncontrado=El archivo no existe o todavía no está listo.
libroNoEstaEnEstante=Ese libro no está en este estante.
referenciaNoEstaEnEstante=El libro de referencia no está en este estante.
favoritosNoSeRenombra=El estante de favoritos no se puede renombrar.
favoritosNoSeBorra=El estante de favoritos no se puede borrar.
estanteDuplicado=Ya tienes un estante llamado "{0}".
formatoNoSoportado="{0}": formato no soportado. Se aceptan libros (EPUB, PDF), documentos (DOCX, DOC, ODT, RTF, TXT, MD, HTML, PPTX, JSON, YAML, LOG) y hojas de cálculo (XLSX, XLS, ODS, CSV).
formatoNoCoincide="{0}": no parece un {1} válido (el contenido no coincide con la extensión).
archivoVacio="{0}": el archivo está vacío.
sinArchivos=No llegó ningún archivo.
ningunArchivoAceptado=No se pudo agregar ningún archivo: {0}
algunosRechazados=Se agregaron {0} archivo(s). No se pudieron agregar: {1}
datosNoDisponibles=Los archivos de la biblioteca no están disponibles ahora mismo (disco desconectado). Tu biblioteca, progreso y notas siguen funcionando.
calificacionInvalida=La calificación va de 0,5 a 5 en pasos de media estrella.
deseoConArchivo=Un libro con archivo no puede volver a la lista de deseos.
libroSinArchivo=Este libro no tiene archivo.
deseoSoloConArchivo=Un deseo pasa a tu biblioteca cuando subes su archivo: usa «Ya lo tengo» y elige el archivo.
deseoUnSoloArchivo=Para cumplir un deseo sube un solo archivo (llegaron {0}).
noEsUnDeseo=Ese libro ya no está en tu lista de deseos.
rutaInvalida=La dirección pedida no es válida.
rutaNoEncontrada=La dirección pedida no existe.
capituloFueraDeRango=El libro tiene {0} capítulo(s): elige uno entre 0 y {1}.
vozInvalida=La voz "{0}" no es válida.
datosInvalidos=Revisa los datos enviados: {0}.
campoValorInvalido=El campo "{0}" no admite el valor enviado ({1}).
campoTipoInvalido=El campo "{0}" llegó con un tipo que no corresponde.
cuerpoInvalido=El cuerpo de la petición viene vacío o no es un JSON válido.
parametroFaltante=Falta el parámetro obligatorio "{0}".
parametroInvalido=El parámetro "{0}" no admite el valor enviado ({1}).
archivoDemasiadoGrande=El archivo o la subida supera el tamaño máximo: {0} por archivo y {1} por subida.
subidaIncompleta=La subida llegó incompleta o no es multipart. Inténtalo de nuevo.
errorInesperado=Ocurrió un error inesperado procesando la petición. Inténtalo de nuevo.
progresoMasReciente=Hay un progreso más reciente guardado desde otro dispositivo; se conserva ese.
originalNoGuardado=No se pudo guardar el original de "{0}".
demasiadosArchivos=Puedes subir hasta {0} archivos a la vez y llegaron {1}. Súbelos en tandas.
sinEspacio=No queda espacio suficiente en el disco de la biblioteca para esta subida. Avísale a quien administra la biblioteca.
demasiadosEstantes=Ya tienes {0} estantes, el máximo. Borra alguno antes de crear otro.
yaLoTenias=Ya tenías en tu biblioteca: {0}.
vozNoDisponible=La voz "{0}" no está en el catálogo. Elige una de la lista de voces.
valorFueraDeRango=El campo "{0}" debe ser un número entre {1} y {2}.
conflictoConcurrente=Otra petición igual llegó al mismo tiempo. Recarga y comprueba el resultado.
contenidoNoSoportado=La petición debe enviarse como JSON (Content-Type: application/json).
traductorNoDisponible=El traductor no está disponible ahora mismo. Inténtalo de nuevo en unos minutos; la lectura sigue funcionando.
idiomaNoSoportado=El idioma "{0}" no está disponible para traducir. Se admiten: {1}.
mismoIdioma=El texto ya está en el idioma de destino ("{0}").
demasiadoTextoTraducido=Has traducido mucho texto en poco tiempo ({0} caracteres por minuto como máximo). Espera un momento y vuelve a intentarlo.
demasiadosCapitulosTraducidos=Has pedido traducir muchos capítulos seguidos ({0} por hora como máximo). Espera un poco antes de pedir otro.
traductorOcupado=El traductor está ocupado con otros capítulos. Vuelve a intentarlo en un minuto.
libroAunSinConvertir=El libro todavía se está preparando; podrás traducirlo cuando termine.
capituloSinTexto=No se encontró el texto de este capítulo. Si el libro se acaba de convertir, inténtalo de nuevo en un momento.
traduccionFallida=No se pudo traducir el capítulo: {0}
carpetaNoEncontrada=La carpeta no existe o no es tuya.
carpetaDuplicada=Ya tienes una carpeta llamada "{0}" en ese lugar.
carpetaDentroDeSiMisma=Una carpeta no se puede mover dentro de sí misma ni de una de sus subcarpetas.
carpetaDemasiadoProfunda=Las carpetas se pueden anidar hasta {0} niveles.
demasiadasCarpetas=Ya tienes {0} carpetas, el máximo. Borra alguna antes de crear otra.
carpetaSoloDocumentos=Las carpetas son para documentos personales: sube los archivos como documentos.
soloDocumentosEnCarpetas=Solo los documentos personales van en carpetas ("{0}" no es un documento).
carpetaNoVacia=La carpeta tiene {0} documento(s) y {1} subcarpeta(s): elige si lo de dentro pasa a la carpeta de arriba o se borra.

# Mensajes de Bean Validation ({clave} en las anotaciones).
validacion.obligatorio=es obligatorio
validacion.maximo=no puede superar los {max} caracteres
validacion.noNegativo=no puede ser negativo
validacion.maximoElementos=no puede tener más de {max} elementos
validacion.anio=debe estar entre -3000 y 2100
validacion.rango=está fuera del rango permitido
