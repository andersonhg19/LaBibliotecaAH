# Pruebas: PostgreSQL de verdad (Testcontainers, ver PostgresDeVerdad), Flyway real y validate.
spring.application.name=biblioteca-service-test
server.servlet.context-path=/biblioteca
spring.main.banner-mode=off

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jackson.time-zone=America/Bogota
spring.flyway.enabled=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=es
spring.web.locale-resolver=fixed

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

secret=secreto-de-pruebas
biblioteca.taller-url=http://127.0.0.1:9
biblioteca.timeout-conexion-ms=500
biblioteca.timeout-lectura-ms=500
biblioteca.voz-por-defecto=edge.es-ES-AlvaroNeural
biblioteca.prefijo-publico=/BIBLIOTECA-SERVICE/biblioteca
biblioteca.buzon-usuarios=anderson@biblioteca.ah:1,samy@biblioteca.ah:2
biblioteca.buzon-espera-ms=0
biblioteca.tareas.habilitadas=false

spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=2GB
spring.servlet.multipart.file-size-threshold=1MB
