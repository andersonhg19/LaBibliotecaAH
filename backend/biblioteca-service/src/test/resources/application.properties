# Pruebas: PostgreSQL de verdad (Testcontainers, ver PostgresDeVerdad), Flyway real y validate.
spring.application.name=biblioteca-service-test
server.servlet.context-path=/biblioteca
spring.main.banner-mode=off

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jackson.time-zone=America/Bogota
spring.flyway.enabled=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=es
spring.web.locale-resolver=fixed

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

secret=secreto-de-pruebas
biblioteca.taller-url=http://127.0.0.1:9
biblioteca.timeout-conexion-ms=500
biblioteca.timeout-lectura-ms=500
biblioteca.voz-por-defecto=edge.es-ES-AlvaroNeural
biblioteca.prefijo-publico=/BIBLIOTECA-SERVICE/biblioteca
biblioteca.buzon-usuarios=anderson@biblioteca.ah:1,samy@biblioteca.ah:2
biblioteca.buzon-espera-ms=0
biblioteca.tareas.habilitadas=false

spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=1GB
server.tomcat.max-swallow-size=${spring.servlet.multipart.max-request-size}
biblioteca.sesion.verificar=false
biblioteca.auth-url=http://127.0.0.1:9
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jackson.deserialization.accept-float-as-int=false
biblioteca.limpieza.edad-minima-horas=6
spring.servlet.multipart.file-size-threshold=1MB

# Traductor (contratos v1.3): la URL la pone PostgresDeVerdad (TraductorFalso). Capitulos de mas
# de 200 caracteres van en segundo plano; lotes pequenos para probar el reparto.
biblioteca.traductor.timeout-conexion-ms=1000
biblioteca.traductor.timeout-lectura-ms=15000
biblioteca.traductor.idiomas=en,es
biblioteca.traductor.caracteres-por-minuto=12000
biblioteca.traductor.capitulos-por-hora=1000
biblioteca.traductor.capitulo-sincrono-max-caracteres=200
biblioteca.traductor.lote-frases=3
biblioteca.traductor.lote-caracteres=4000
biblioteca.traductor.hilos=1
biblioteca.traductor.cola=2
biblioteca.traductor.error-segundos=60
biblioteca.traductor.cache-dias=180
