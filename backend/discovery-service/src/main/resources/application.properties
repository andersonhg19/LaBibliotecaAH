server.port=8860

spring.application.name=discovery-service

eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://discovery-service:8860/eureka}

eureka.instance.hostname=discovery-service

# Pocas instancias y una sola maquina: sin autopreservacion, desalojo y cache
# de respuesta rapidos para que un contenedor reemplazado salga del registro en segundos.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.response-cache-update-interval-ms=3000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
