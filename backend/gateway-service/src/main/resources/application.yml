server:
  port: 8920

spring:
  application:
    name: gateway-service
  # El gateway NO bufferiza cuerpos: Spring Cloud Gateway (Netty) los pasa en
  # streaming al servicio de destino, asi que una subida de 300 MB o una
  # respuesta de audio no pasan enteras por memoria. Este limite solo afecta a
  # los codecs que si leen el cuerpo completo (filtros que lo modifiquen, que
  # aqui no hay); se sube a 16 MB por si algun dia se anade uno.
  codec:
    max-in-memory-size: 16MB
  cloud:
    discovery:
      enabled: true
    loadbalancer:
      cache:
        # La lista de instancias se refresca rapido para dejar de usar la vieja.
        ttl: 5s
    gateway:
      httpclient:
        # Subidas grandes y audios largos: sin tope de respuesta y con margen
        # de tiempo. connect-timeout en ms.
        connect-timeout: 10000
        response-timeout: 30m
      # SIN filtro Retry, a proposito: Spring Cloud Gateway guarda en memoria
      # directa el cuerpo de TODA peticion que pase por Retry (aunque solo
      # reintente GET/HEAD), y una subida de 250-300 MB agotaba la memoria del
      # gateway (regresion RG-02, 2026-11-11). Tras un despliegue, la instancia
      # vieja sale del registro en segundos (latido 5 s, baja a 15 s, cache del
      # balanceador 5 s), sin necesidad de reintentar.
      globalcors:
        corsConfigurations:
          '[/**]':
            # Lista EXPLICITA de origenes (estandares §9), separada por comas.
            # Nunca "*" con credenciales.
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3100,http://127.0.0.1:3100}
            allowedHeaders:
              - "*"
            # Range/Content-Range/Accept-Ranges/Content-Length deben verse
            # desde la web para que <audio> y el lector salten dentro del archivo.
            exposedHeaders:
              - Content-Range
              - Accept-Ranges
              - Content-Length
              - Content-Disposition
              - X-Request-Id
            allowedMethods:
              - GET
              - HEAD
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowCredentials: true
            maxAge: 3600

eureka:
  instance:
    preferIpAddress: true
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8860/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health
