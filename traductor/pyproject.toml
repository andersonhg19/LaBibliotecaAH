[project]
name = "bah-traductor"
version = "1.3.2"
description = "Traductor de La Biblioteca AH: Opus-MT en CTranslate2 (int8, CPU) con la API de LibreTranslate"
requires-python = ">=3.12"
# Dependencias fijadas con hashes en requirements.txt (ejecución) y requirements-dev.txt (pruebas y calidad),
# generadas desde requisitos/*.in con requisitos/compilar.sh.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- pruebas (puerta única)
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Sin -m explícito se salta la de humo con el modelo real (CI); la imagen "pruebas" la incluye.
addopts = "-ra -m 'not modelo' --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=85"
markers = ["modelo: prueba de humo con el modelo real (necesita /modelos; corre en la imagen de pruebas)"]
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError", "\\.\\.\\.$"]

# ---------------------------------------------------------------- ruff (lint + formato)
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "T20", "BLE", "LOG", "G"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # texto en español: comillas «», rayas y tildes son intencionales
    "G004",
    "SIM905",                      # listas de palabras escritas como texto: se leen y se mantienen mejor
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "B011"]
"convertir/**" = ["T20"]  # script de construcción: informa por stdout

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
packages = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["ctranslate2", "ctranslate2.*", "sentencepiece"]
ignore_missing_imports = true
